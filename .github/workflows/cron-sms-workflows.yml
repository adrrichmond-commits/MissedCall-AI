# External scheduler for the SMS workflow sweep (the app has no scheduler of
# its own by design). The sweep dedupes internally and is safe to ping on this
# cadence; the endpoint 401s without the right secret (CRON_SECRET).
name: cron-sms-workflows
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping SMS workflow sweep
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET (repo Actions secret) is not set - scheduler inactive, skipping ping. Owner: add it under Settings > Secrets and variables > Actions."; exit 0; fi
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time 120 \
            -H "x-cron-secret: $CRON_SECRET" \
            https://www.answermissedcalls.com/api/cron/sms-workflows)
          echo "HTTP $code"; cat /tmp/resp.json; echo
          test "$code" = "200"
      # Keep-warm: the public site idles to sleep between visitors; this extra
      # ping on the same */15 schedule wakes it so fewer visitors hit a cold
      # start. Non-fatal by design; the endpoint needs no secret.
      - name: Keep-warm public site (non-fatal)
        if: always()
        run: |
          curl -sS -o /dev/null --max-time 30 https://www.answermissedcalls.com/api/healthz || true
